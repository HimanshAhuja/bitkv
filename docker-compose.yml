# Local observability stack:  docker compose up --build
#
#   bitkv        redis-cli -p 6380                 metrics: http://localhost:9121/metrics
#   Prometheus   http://localhost:9090             alerts:  http://localhost:9090/alerts
#   Grafana      http://localhost:3000             dashboard "bitkv overview" (no login)
#
# Add traffic:   docker compose --profile load up
services:
  bitkv:
    build: .
    image: bitkv:local
    ports: ["6380:6380", "9121:9121"]
    volumes: ["bitkv-data:/data"]
    restart: unless-stopped
    stop_grace_period: 30s

  prometheus:
    image: prom/prometheus:v2.53.0
    ports: ["9090:9090"]
    volumes:
      - ./deploy/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
    depends_on: [bitkv]

  grafana:
    image: grafana/grafana:11.1.0
    ports: ["3000:3000"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/bitkv.json
    volumes:
      - ./deploy/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [prometheus]

  load:
    image: bitkv:local
    profiles: [load]
    entrypoint: ["sh", "-c", "while true; do bitkvctl --addr bitkv:6380 --metrics http://bitkv:9121 load --n 200000 --c 8; sleep 5; done"]
    depends_on: [bitkv]

volumes:
  bitkv-data:
